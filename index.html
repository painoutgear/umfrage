<style>
/* Online-Umfrage Painout Gear · Fragebogen v2-online
   Gleiche Fragen wie die Kurzversion der iPad-App, plus PLZ und Bezug.
   Läuft auf umfrage.painoutgear.de (GitHub Pages) und speichert über die Apps-Script-Web-App.
   Ohne Google-Anmeldung (credentials: omit), deshalb kein Fehler bei mehreren Google-Konten.
   Vorschau ohne Speichern: ?vorschau=1 an die Adresse hängen. */
:root{--black:#0A0B0D;--white:#F4F6F9;--blue:#20A6F4;--blue-l:#E6F5FE;--grey:#5B6370;--grey-l:#9AA3AF;--line:#D9DEE5;--card:#fff;--bad:#B91C1C}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--white);color:var(--black);font-family:Barlow,system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 32px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{height:20px;width:auto;display:block}
.brand .blabel{font-family:Barlow,sans-serif;font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6b7280;padding-top:2px}
.progress{height:7px;background:#E3E7EC;border-radius:99px;overflow:hidden;margin:10px 0 16px}
.progress div{height:100%;background:var(--blue);transition:width .25s}
@media (prefers-reduced-motion:reduce){.progress div{transition:none}}
h1{font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;font-size:34px;line-height:1.05;margin:0 0 12px}
p{margin:0 0 12px}
.muted{color:var(--grey)}.small{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.q{font-size:23px;font-weight:700;line-height:1.25;margin:2px 0 8px}
.help{color:var(--grey);font-size:16px;margin-bottom:12px}
.opts{display:grid;gap:9px;margin:12px 0 4px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:12px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;font-weight:500}
.opt .box{flex:0 0 24px;height:24px;border:2px solid var(--grey-l);border-radius:50%}
.opt.multi .box{border-radius:7px}
.opt.sel{border-color:var(--blue);background:var(--blue-l)}
.opt.sel .box{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 4px #fff}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:10px 22px;border-radius:14px;border:2px solid var(--black);background:var(--black);color:#fff;font-weight:700;cursor:pointer}
.btn.sec{background:#fff;color:var(--black);border-color:var(--line)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--grey);min-height:44px;padding:6px 8px;font-weight:600}
.btn:disabled{opacity:.35;cursor:not-allowed}
.ggp{display:flex;align-items:baseline;gap:10px;margin:4px 0 10px}
.ggp .lab{font-size:15px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.04em}
.ggp .val{font-size:44px;font-weight:800;line-height:1;color:var(--blue);padding:6px 14px;border-radius:14px;background:var(--blue-l)}
.ggp.neu .val{animation:ggpop .7s ease}
@keyframes ggpop{0%{transform:scale(.7);background:#FFE08A}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.btn.ghost.sel{color:var(--blue);background:var(--blue-l);border-color:var(--blue)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.concept{background:var(--black);color:#fff;border-radius:16px;padding:20px 22px;margin:4px 0 14px;position:relative;overflow:hidden}
.concept::before{content:"";position:absolute;right:-46px;top:-30px;width:90px;height:260px;background:var(--blue);transform:skewX(-12.3deg)}
.concept b{display:block;font-family:"Barlow Condensed",sans-serif;font-style:italic;font-size:24px;margin-bottom:8px;position:relative}
.concept ul{margin:0 0 10px;padding-left:20px;position:relative;max-width:86%}
.concept li{margin-bottom:6px}
.concept p{position:relative;max-width:86%;color:#C9D1DB;margin:0;font-size:16px}
.mini{border-left:5px solid var(--blue);background:#fff;padding:8px 12px;border-radius:8px;font-size:15px;color:var(--grey);margin-bottom:12px}
.price{display:flex;align-items:center;gap:10px;margin:14px 0}
.price input,.field input{min-height:58px;font-size:26px;font-weight:700;padding:8px 12px;border:2px solid var(--line);border-radius:14px;background:#fff}
.price input{width:150px;text-align:right}
.field{margin:10px 0}.field label{display:block;font-weight:600;margin-bottom:6px;font-size:16px}
.field input{width:100%;font-size:18px;font-weight:500}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;font-size:15px}
.check .box{flex:0 0 26px;height:26px;border:2px solid var(--grey-l);border-radius:7px}
.check.sel{border-color:var(--blue);background:var(--blue-l)}.check.sel .box{background:var(--blue);border-color:var(--blue)}
.note{background:#FFF8E6;border:1px solid #F5D98B;border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:12px}
.err{color:var(--bad);font-size:15px;margin-top:10px}
.legal-links{text-align:center;margin:16px 0 0;font-size:14px}
.legal-links button{background:none;border:0;color:var(--grey);text-decoration:underline;cursor:pointer;font-size:14px;padding:6px}
.legal h1{font-size:28px;hyphens:auto;overflow-wrap:anywhere}.legal h2{font-size:20px;margin:18px 0 6px}.legal p,.legal li{font-size:15px}.legal ul{padding-left:20px}
.video{position:relative;display:block;width:100%;max-width:440px;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#000;margin:6px auto 8px;padding:0;border:0}

<path fill="#20a6f4" d="M851.6 911.3 1040.7 689.5 1064.2 689.5 875.3 911.3 Z"/>
</svg>`;
let videoOpen = false, vStallT = null;
const VIDEO_FILE = "video.mp4";
function videoHint() {
  if (r.videoDone) return "Danke! Du kannst das Video gern noch einmal ansehen oder weitermachen.";
  if (r.videoError) return "Das Video lädt gerade nicht. Du kannst trotzdem weitermachen.";
  return videoOpen ? "Weiter geht es, sobald das Video zu Ende ist." : "Bitte schau dir zuerst das kurze Video an (28 Sekunden). Danach geht es weiter.";
}
function videoBlock() {
  const hint = `<p class="small muted vhint" id="pgVhint">${videoHint()}</p>`;
  if (videoOpen) return `<div class="video"><video id="pgVideo" src="${VIDEO_FILE}" playsinline webkit-playsinline preload="auto" aria-label="Erklärvideo"></video><button class="vtap" data-act="togglevideo" aria-label="Video abspielen oder anhalten"></button><div class="vbar"><i id="pgVbar"></i></div></div>${hint}`;
  return `<button class="video vposter" data-act="playvideo" aria-label="Erklärvideo abspielen">${POSTER_LOGO}<span class="play"></span><span class="vlen">Video · 28 Sek.</span></button>${hint}`;
}
function videoUnlock(kind) {
  if (kind === "done") r.videoDone = true; else if (!r.videoDone) r.videoError = kind;
  clearTimeout(vStallT);
  const b = document.querySelector('[data-act="next"]'); if (b) b.disabled = false;
  const h = document.getElementById("pgVhint"); if (h) h.textContent = videoHint();
}
function bindVideo(startNow) {
  const v = document.getElementById("pgVideo"); if (!v) return;
  const bar = document.getElementById("pgVbar");
  v.addEventListener("timeupdate", () => {
    if (v.duration) { if (bar) bar.style.width = Math.min(100, v.currentTime / v.duration * 100) + "%"; if (v.currentTime >= v.duration - 0.4) videoUnlock("done"); }
  });
  v.addEventListener("ended", () => videoUnlock("done"));
  v.addEventListener("playing", () => clearTimeout(vStallT));
  v.addEventListener("error", () => videoUnlock("error"));
  if (startNow) {
    clearTimeout(vStallT);
    vStallT = setTimeout(() => { if (!v.currentTime) videoUnlock("stall"); }, 20000);
    const pr = v.play(); if (pr && pr.catch) pr.catch(() => {});
  }
}
const legalLinks = () => `<div class="legal-links"><button data-act="impressum">Impressum</button> · <button data-act="datenschutz">Datenschutz</button></div>`;
const VIDEO = "dflct1-umfrage-final";
const r = { id: uid(), startedAt: new Date().toISOString(), role: null, a: {}, gg: [], hist: [], stepId: "consent", contact: { email: "", ok: false } };
let view = "survey", sending = false, sendErr = "", lastNav = 0, lockUntil = 0, ggSel = null;
const LOCK_MS = 450; /* Tipps direkt nach einem Fragenwechsel ignorieren (Doppeltipp-Schutz) */
const lock = () => { lockUntil = Date.now() + LOCK_MS; };

const step = id => STEPS.find(s => s.id === id);
const visible = s => !s.show || s.show(r);
function nextId(from) { const i = STEPS.findIndex(s => s.id === from); for (let j = i + 1; j < STEPS.length; j++) if (visible(STEPS[j])) return STEPS[j].id; return null; }
function progress() { const vis = STEPS.filter(visible); return Math.max(.04, (vis.findIndex(s => s.id === r.stepId) + 1) / (vis.length + 1)); }

function setAns(id, v) { r.a[id] = v; if (id === "role") r.role = (v === "u16" || v === "none") ? null : v; }
function goNext() {
  if (Date.now() - lastNav < 280) return; lastNav = Date.now();
  if (r.stepId === "role" && !r.role) { view = "screenout"; render(); return; }
  const nx = nextId(r.stepId);
  if (!nx) return;
  r.hist.push(r.stepId); r.stepId = nx; ggSel = null; lock(); render(); window.scrollTo(0, 0);
}
function goBack() {
  const st = step(r.stepId);
  if (st.type === "gg" && r.gg.length) { r.gg.pop(); ggSel = null; lock(); render(); return; }
  const prev = r.hist.pop(); if (!prev) return;
  r.stepId = prev; if (step(prev).type === "gg" && r.gg.length) r.gg.pop();
  ggSel = null; lock(); render(); window.scrollTo(0, 0);
}

const opts = (list, cur, act, multi) => `<div class="opts">${list.map(o => {
  const sel = multi ? (cur || []).includes(o.v) : cur === o.v;
  return `<button class="opt ${multi ? "multi" : ""} ${sel ? "sel" : ""}" data-act="${act}" data-v="${esc(o.v)}"><span class="box"></span><span>${esc(o.l)}</span></button>`;
}).join("")}</div>`;
function nav(canNext, label) {
  const st = step(r.stepId);
  const canBack = r.hist.length > 0 || (st.type === "gg" && r.gg.length > 0);
  return `<div class="nav"><button class="btn sec" data-act="back" ${canBack ? "" : 'style="visibility:hidden"'}>Zurück</button>${label === null ? "" : `<button class="btn" data-act="next" ${canNext ? "" : "disabled"}>${label || "Weiter"}</button>`}</div>`;
}

function body() {
  const st = step(r.stepId), q = st.q ? esc(st.q(r)) : "", help = st.help ? `<div class="help">${esc(st.help(r))}</div>` : "", mini = st.mini ? MINI : "";
  switch (st.type) {
    case "consent":
      return `<h1>Kurze Umfrage zu Fußballsocken</h1>
      <p>Es geht darum, was beim Fußball an Fuß und Unterschenkel stört. Das dauert etwa drei Minuten.</p>
      <p>Es gibt keine richtigen oder falschen Antworten. Am meisten hilft eine ehrliche Meinung, auch Kritik.</p>
      <p class="small muted">Die Antworten werden anonym gespeichert, ohne Namen, und nur ausgewertet, um ein neues Produkt zu entwickeln. Durchgeführt von Sebastian Kaspari, Gründungsvorhaben aus Magdeburg. Wenn du abbrichst, wird nichts gespeichert. Details stehen in den Datenschutzhinweisen unten.</p>
      ${LIVE ? "" : `<div class="note">Vorschau: In dieser Ansicht wird nichts gespeichert.</div>`}
      <div class="check ${r.a.consent ? "sel" : ""}" data-act="consent"><span class="box"></span><span>Ich bin einverstanden, dass meine Antworten anonym gespeichert und ausgewertet werden, wie in den Datenschutzhinweisen beschrieben.</span></div>
      ${nav(!!r.a.consent, "Los geht's")}${legalLinks()}`;
    case "single": return `${mini}<div class="q">${q}</div>${help}${opts(st.opts(r), r.a[st.id], "single")}${nav(r.a[st.id] != null)}`;
    case "multi": return `${mini}<div class="q">${q}</div>${help}${opts(st.opts(r), r.a[st.id], "multi", true)}${nav((r.a[st.id] || []).length > 0)}`;
    case "concept": return `<div class="help">Stell dir bitte folgendes Produkt vor. Es ist noch nicht im Handel.</div>${videoBlock()}${CONCEPT}${nav(!!(r.videoDone || r.videoError))}`;
    case "price": {
      const cur = r.a[st.id], val = (cur != null && cur !== "dk") ? String(cur).replace(".", ",") : "";
      const intro = st.id === "vw_too_exp" ? `<div class="help">Jetzt geht es um den Preis. Nenn einfach den Betrag, der dir spontan passend erscheint. Gemeint ist immer ein Paar.</div>` : "";
      return `${MINI}${intro}<div class="q">${q}</div><div class="price"><input id="priceIn" inputmode="decimal" autocomplete="off" value="${esc(val)}" placeholder="0" aria-label="Preis in Euro"><b style="font-size:26px">€</b></div>
      <button class="btn ghost ${cur === "dk" ? "sel" : ""}" data-act="pricedk">Kann ich nicht sagen</button>${nav(cur != null)}`;
    }
    case "vwcheck": {
      const f = (k, l) => `<div class="field"><label>${l}</label><div class="price" style="margin:2px 0"><input data-vw="${k}" inputmode="decimal" value="${esc(String(r.a[k]).replace(".", ","))}"><b>€</b></div></div>`;
      return `<div class="q">Kurzer Check deiner Preisangaben</div><div class="help">Normalerweise steigen die Beträge von oben nach unten. Bitte prüfe kurz, ob du dich vertippt hast. Wenn alles so gemeint ist, einfach weiter.</div>
      ${f("vw_too_cheap", "So billig, dass du an der Qualität zweifeln würdest")}${f("vw_cheap", "Gutes Angebot, günstig")}${f("vw_exp", "Teuer, aber noch denkbar")}${f("vw_too_exp", "So teuer, dass du sie auf keinen Fall kaufen würdest")}${nav(true)}`;
    }
    case "gg": {
      const p = ggNext(r.gg);
      if (p == null) { setTimeout(goNext, 0); return ""; }
      const qq = W(r, `Angenommen, die Socke kostet ${p} € pro Paar. Wie wahrscheinlich würdest du sie kaufen?`, `Angenommen, die Socke kostet ${p} € pro Paar. Wie wahrscheinlich würdest du sie für dein Kind kaufen?`, `Angenommen, die Socke kostet ${p} € pro Paar. Wie wahrscheinlich würdest du sie deinem Team empfehlen?`);
      const neu = r.gg.length > 0;
      return `${MINI}<div class="ggp ${neu ? "neu" : ""}"><span class="lab">${neu ? "Neuer Preis" : "Preis"}</span><span class="val">${p} €</span></div><div class="q">${esc(qq)}</div>${opts(O.pi, ggSel, "gg")}${nav(ggSel != null)}`;
    }
    case "plz": {
      const cur = r.a.plz, ok = cur === "na" || /^\d{2}$/.test(cur || "");
      return `<div class="q">Wie lauten die ersten zwei Ziffern deiner Postleitzahl?</div><div class="help">Nur die ersten zwei, zum Beispiel 39 für Magdeburg. So sehen wir, ob es regionale Unterschiede gibt.</div>
      <div class="price"><input id="plzIn" inputmode="numeric" maxlength="2" autocomplete="off" value="${esc(cur && cur !== "na" ? cur : "")}" placeholder="39" aria-label="Erste zwei Ziffern der Postleitzahl"></div>
      <button class="btn ghost ${cur === "na" ? "sel" : ""}" data-act="plzna">Möchte ich nicht sagen</button>${nav(ok)}`;
    }
    case "contact": {
      const c = r.contact, valid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c.email || "");
      return `<div class="q">Fast geschafft. Möchtest du erfahren, wenn es die Socke gibt?</div>
      <div class="help">Freiwillig. Die E-Mail-Adresse wird getrennt von deinen Antworten gespeichert.</div>
      <div class="field"><label for="email">E-Mail-Adresse</label><input type="email" id="email" value="${esc(c.email)}" placeholder="name@beispiel.de" autocomplete="email"></div>
      <div class="check ${c.ok ? "sel" : ""}" data-act="contactok"><span class="box"></span><span>Ich möchte per E-Mail informiert werden, wenn die Socke erhältlich ist. Die Adresse wird nur dafür genutzt, nicht weitergegeben und auf Wunsch gelöscht (painoutgear@gmail.com).</span></div>
      ${sendErr ? `<div class="err">${esc(sendErr)}</div>` : ""}
      <div class="nav"><button class="btn sec" data-act="back">Zurück</button>
      <button class="btn sec" data-act="nocontact" ${sending ? "disabled" : ""}>Ohne E-Mail abschließen</button>
      <button class="btn" data-act="sendcontact" ${valid && c.ok && !sending ? "" : "disabled"}>${sending ? "Wird gesendet …" : "Eintragen und abschließen"}</button></div>`;
    }
  }
  return "";
}
function render() {
  const app = document.getElementById("app");
  if (view === "legal") { app.innerHTML = `<div class="card">${legalView === "impressum" ? IMPRESSUM : DATENSCHUTZ}<div class="nav"><button class="btn" data-act="legalback">Zurück zur Umfrage</button></div></div>`; return; }
  if (view === "done") { app.innerHTML = `<div class="card" style="text-align:center;padding:36px 20px"><h1>Vielen Dank!</h1><p class="muted">Deine Antworten sind angekommen. Du kannst das Fenster jetzt schließen.</p>${LIVE ? "" : `<p class="note">Vorschau: Es wurde nichts gespeichert.</p>`}${legalLinks()}<p class="small muted">Kennst du andere Fußballeltern, Spieler oder Trainer? Teile die Umfrage gern in deiner Mannschaftsgruppe.</p>${location.protocol === "https:" || !LIVE ? `<a class="btn" id="waShare" target="_blank" rel="noopener" href="${esc(shareLink())}">Per WhatsApp teilen</a>` : ""}</div>`; return; }
  if (view === "screenout") { app.innerHTML = `<div class="card" style="text-align:center;padding:36px 20px"><h1>Danke dir!</h1><p class="muted">Für diese Umfrage suchen wir Spielerinnen und Spieler ab 16, Eltern und Trainer. Wenn du jünger als 16 bist, schick den Link gern an deine Mutter oder deinen Vater.</p></div>`; return; }
  app.innerHTML = `<div class="progress"><div style="width:${Math.round(progress() * 100)}%"></div></div><div class="card">${body()}</div>`;
  bindInputs();
  if (document.getElementById("pgVideo")) bindVideo(false);
}
function bindInputs() {
  const pin = document.getElementById("priceIn");
  if (pin) pin.addEventListener("input", () => {
    const v = parseEur(pin.value), id = r.stepId;
    if (v != null) setAns(id, v); else delete r.a[id];
    const dk = document.querySelector('[data-act="pricedk"]'); if (dk) dk.classList.remove("sel");
    const b = document.querySelector('[data-act="next"]'); if (b) b.disabled = v == null;
  });
  document.querySelectorAll("[data-vw]").forEach(el => el.addEventListener("input", () => { const v = parseEur(el.value); if (v != null) setAns(el.getAttribute("data-vw"), v); }));
  const plz = document.getElementById("plzIn");
  if (plz) plz.addEventListener("input", () => {
    plz.value = plz.value.replace(/\D/g, "").slice(0, 2);
    if (/^\d{2}$/.test(plz.value)) r.a.plz = plz.value; else delete r.a.plz;
    const na = document.querySelector('[data-act="plzna"]'); if (na) na.classList.remove("sel");
    const b = document.querySelector('[data-act="next"]'); if (b) b.disabled = !r.a.plz;
  });
  const em = document.getElementById("email");
  if (em) em.addEventListener("input", () => {
    r.contact.email = em.value.trim();
    const b = document.querySelector('[data-act="sendcontact"]');
    if (b) b.disabled = !(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(r.contact.email) && r.contact.ok);
  });
}

/* Teilen: gleicher Link inkl. Quelle, damit Weiterleitungen dem Kanal zugerechnet werden */
let EXEC_URL = "";
function shareLink() {
  const url = location.origin + location.pathname + (SRC ? "?src=" + SRC : "");
  const text = "Hallo zusammen, kurze Bitte: Ein Fußballtrainer aus Magdeburg entwickelt eine neue Fußballsocke und sucht ehrliche Meinungen von Eltern, Spielern ab sechzehn und Trainern. Die Umfrage ist anonym und dauert etwa drei Minuten: " + url;
  return "https://wa.me/?text=" + encodeURIComponent(text);
}
function buildRecord() {
  const now = new Date();
  return {
    id: r.id, qv: QV, status: "complete", startedAt: r.startedAt, completedAt: now.toISOString(),
    durationSec: Math.round((now - new Date(r.startedAt)) / 1000),
    meta: { anlass: SRC ? "online: " + SRC : "online", bezug: r.a.bezug || "", modus: "self", short: true, test: false, kanal: "online", quelle: SRC, video: VIDEO, videoPlayed: !!r.videoPlayed, videoDone: !!r.videoDone, videoError: r.videoError || "" },
    role: r.role, a: Object.assign({}, r.a), md: [], gg: r.gg, ggMax: ggMax(r.gg), vwState: vwState(r.a)
  };
}
function submit(withEmail) {
  if (sending) return;
  const rec = buildRecord();
  const email = withEmail && r.contact.ok ? r.contact.email : "";
  if (!LIVE) { view = "done"; render(); return; }
  sending = true; sendErr = ""; render();
  /* Text als Inhalt: einfache Anfrage ohne Vorabprüfung, ohne Google-Cookies */
  fetch(API, { method: "POST", credentials: "omit", redirect: "follow", body: JSON.stringify({ rec: JSON.stringify(rec), email: email }) })
    .then(res => res.json())
    .then(d => {
      if (!d || !d.ok) throw new Error("nicht gespeichert");
      sending = false; view = "done"; render(); window.scrollTo(0, 0);
    })
    .catch(() => { sending = false; sendErr = "Das Senden hat nicht geklappt. Bitte prüfe deine Verbindung und tippe noch einmal."; render(); });
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.getAttribute("data-act"), v = t.getAttribute("data-v"), sid = r.stepId;
  if (Date.now() < lockUntil && ["single", "multi", "gg", "pricedk", "plzna", "next"].includes(act)) return;
  switch (act) {
    case "consent": r.a.consent = !r.a.consent; render(); break;
    case "playvideo": videoOpen = true; r.videoPlayed = true; render(); bindVideo(true); break;
    case "togglevideo": { const vv = document.getElementById("pgVideo"); if (vv) { if (vv.paused || vv.ended) { const pr = vv.play(); if (pr && pr.catch) pr.catch(() => {}); } else vv.pause(); } break; }
    case "impressum": openLegal("impressum"); break;
    case "datenschutz": openLegal("datenschutz"); break;
    case "legalback": view = returnView; render(); window.scrollTo(0, 0); break;
    case "next": {
      if (step(sid).type === "gg") {
        const p = ggNext(r.gg); if (p == null || ggSel == null) { if (p == null) goNext(); break; }
        r.gg.push({ p, v: parseInt(ggSel, 10), acc: ggSel === "5" || ggSel === "4" }); ggSel = null;
        if (ggNext(r.gg) == null) goNext(); else { lock(); render(); window.scrollTo(0, 0); }
        break;
      }
      goNext(); break;
    }
    case "back": goBack(); break;
    case "single": setAns(sid, v); render(); break;
    case "multi": {
      let cur = (r.a[sid] || []).slice();
      cur = cur.includes(v) ? cur.filter(x => x !== v) : cur.concat(v);
      setAns(sid, cur); render(); break;
    }
    case "pricedk": setAns(sid, "dk"); render(); break;
    case "plzna": r.a.plz = "na"; render(); break;
    case "gg": ggSel = v; render(); break;
    case "contactok": { const em = document.getElementById("email"); if (em) r.contact.email = em.value.trim(); r.contact.ok = !r.contact.ok; render(); break; }
    case "nocontact": submit(false); break;
    case "sendcontact": submit(true); break;
  }
});
render();
window.__pgStarted = true;
}
</script>
</body>
</html>
